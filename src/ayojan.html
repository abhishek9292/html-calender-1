<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>आयोजन</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="calendar-header">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
        <div class="calendar-title"><h1 class="title has-text-white" style="font-size:1.1rem;margin:0;">मेरे आयोजन</h1></div>
        <i class="fas fa-search" onclick="navigateTo('search')" style="cursor:pointer;"></i>
    </div>

    <div style="padding:1rem;">
        <div class="tabs is-fullwidth">
            <ul>
                <li class="is-active"><a>आगामी</a></li>
                <li><a>पूर्ण</a></li>
                <li><a>सभी</a></li>
            </ul>
        </div>

        <div style="text-align:center;padding:3rem 1rem;">
            <i class="fas fa-calendar-check" style="font-size:4rem;color:#dbdbdb;"></i>
            <p style="color:#7a7a7a;margin-top:1rem;font-size:1.1rem;">कोई आयोजन नहीं है</p>
            <p style="color:#b5b5b5;margin-top:0.5rem;">नया आयोजन जोड़ने के लिए + बटन दबाएं</p>
            <button class="button is-danger" style="margin-top:1.5rem;" onclick="navigateTo('event')">
                <span class="icon"><i class="fas fa-plus"></i></span>
                <span>नया आयोजन बनाएं</span>
            </button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" onclick="navigateTo('home')"><i class="fas fa-home"></i><span>होम</span></a>
        <a class="nav-item" onclick="navigateTo('calendar')"><i class="fas fa-calendar"></i><span>कैलेंडर</span></a>
        <a class="nav-item plus-btn" onclick="$('#plusModal').addClass('is-active')"><i class="fas fa-plus"></i></a>
        <a class="nav-item" onclick="navigateTo('music')"><i class="fas fa-music"></i><span>म्यूजिक</span></a>
        <a class="nav-item active"><i class="fas fa-calendar-check"></i><span>आयोजन</span></a>
    </nav>

    <div class="modal" id="plusModal">
        <div class="modal-background" onclick="$('#plusModal').removeClass('is-active')"></div>
        <div class="modal-content plus-modal-content">
            <div class="plus-option" onclick="alert('छुट्टियां')"><i class="fas fa-umbrella-beach"></i><span>छुट्टियां</span></div>
            <div class="plus-option" onclick="alert('नोट्स')"><i class="fas fa-sticky-note"></i><span>नोट्स</span></div>
            <div class="plus-option" onclick="navigateTo('event')"><i class="far fa-calendar"></i><span>इवेंट्स</span></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/routes.js"></script>
</body>
</html>
