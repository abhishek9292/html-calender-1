<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>कुंडली - राशिफल</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="calendar-header">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
        <div class="calendar-title"><h1 class="title has-text-white" style="font-size:1.1rem;margin:0;">राशिफल</h1></div>
        <i class="fas fa-share-nodes" onclick="alert('शेयर')" style="cursor:pointer;"></i>
    </div>

    <div style="padding:1rem;">
        <div class="tabs is-centered">
            <ul>
                <li class="is-active"><a>आज</a></li>
                <li><a>साप्ताहिक</a></li>
                <li><a>मासिक</a></li>
                <li><a>वार्षिक</a></li>
            </ul>
        </div>

        <h2 class="section-title">आज का राशिफल - 30 अक्टूबर 2025</h2>
        <div id="rashifalGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;"></div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" onclick="navigateTo('home')"><i class="fas fa-home"></i><span>होम</span></a>
        <a class="nav-item" onclick="navigateTo('calendar')"><i class="fas fa-calendar"></i><span>कैलेंडर</span></a>
        <a class="nav-item plus-btn" onclick="$('#plusModal').addClass('is-active')"><i class="fas fa-plus"></i></a>
        <a class="nav-item" onclick="navigateTo('music')"><i class="fas fa-music"></i><span>म्यूजिक</span></a>
        <a class="nav-item" onclick="navigateTo('ayojan')"><i class="fas fa-calendar-check"></i><span>आयोजन</span></a>
    </nav>

    <div class="modal" id="plusModal">
        <div class="modal-background" onclick="$('#plusModal').removeClass('is-active')"></div>
        <div class="modal-content plus-modal-content">
            <div class="plus-option" onclick="navigateTo('event')"><i class="far fa-calendar"></i><span>इवेंट्स</span></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/calendar-data.js"></script>
    <script>
        $(document).ready(function() {
            let html = '';
            calendarData.rashifal.forEach(rashi => {
                html += `<div class="box" style="text-align:center;cursor:pointer;transition:transform 0.2s;" onclick="showRashiDetail('${rashi.name}')">
                    <div style="width:60px;height:60px;background:#f14668;border-radius:50%;margin:0 auto 0.5rem;display:flex;align-items:center;justify-content:center;">
                        <i class="fas fa-star" style="font-size:1.5rem;color:#fff;"></i>
                    </div>
                    <p style="font-weight:700;font-size:1rem;">${rashi.name}</p>
                    <p style="font-size:0.75rem;color:#7a7a7a;margin-top:0.25rem;">${rashi.sign}</p>
                </div>`;
            });
            $('#rashifalGrid').html(html);
        });

        function showRashiDetail(name) {
            const rashi = calendarData.rashifal.find(r => r.name === name);
            if (rashi) {
                alert(`${rashi.name} राशिफल:\n\n${rashi.prediction}`);
            }
        }
    </script>
</body>
</html>
