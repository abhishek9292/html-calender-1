<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भारत भक्ति स्टोर - भारत कैलेंडर</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { padding-top: 65px; padding-bottom: 70px; }
        .product-card { background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1rem; }
        .product-image { width: 100%; height: 200px; background: #e0e0e0; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; }
        .product-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .product-price { font-size: 1.3rem; color: #f14668; font-weight: 700; margin-bottom: 0.5rem; }
        .product-desc { font-size: 0.9rem; color: #7a7a7a; margin-bottom: 1rem; }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: #f14668; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
        .cart-icon { position: relative; }
        .cart-sidebar { position: fixed; right: -350px; top: 65px; width: 350px; height: calc(100vh - 65px); background: white; box-shadow: -2px 0 8px rgba(0,0,0,0.3); transition: right 0.3s; z-index: 100; overflow-y: auto; }
        .cart-sidebar.active { right: 0; }
        .cart-item { display: flex; gap: 1rem; padding: 1rem; border-bottom: 1px solid #f5f5f5; }
        .cart-item-image { width: 60px; height: 60px; background: #e0e0e0; border-radius: 8px; flex-shrink: 0; }
        .cart-item-details { flex: 1; }
        .cart-total { padding: 1rem; background: #f5f5f5; font-size: 1.2rem; font-weight: 700; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="navbar is-danger is-fixed-top">
        <div class="navbar-brand">
            <div class="navbar-item" onclick="navigateTo('home')" style="cursor: pointer;">
                <i class="fas fa-arrow-left" style="font-size: 1.5rem;"></i>
            </div>
            <div class="navbar-item brand-logo">
                <i class="fas fa-store"></i>
                <div class="brand-text"><span>भारत भक्ति</span><span>स्टोर</span></div>
            </div>
            <div class="navbar-end header-icons">
                <a class="navbar-item cart-icon" onclick="toggleCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div style="padding: 1rem;">
        <h2 class="title is-4" style="text-align: center; margin-bottom: 1.5rem;">
            <i class="fas fa-star" style="color: #f14668;"></i>
            प्रोडक्ट्स
        </h2>

        <div id="productsGrid"></div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div style="padding: 1rem; background: #f14668; color: white; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="font-size: 1.2rem; font-weight: 600;">मेरा कार्ट</h3>
            <button onclick="toggleCart()" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div id="cartItems"></div>

        <div class="cart-total">
            <div style="display: flex; justify-content: space-between;">
                <span>कुल:</span>
                <span id="cartTotal">₹0</span>
            </div>
        </div>

        <div style="padding: 1rem;">
            <button class="button is-danger is-fullwidth is-large" onclick="checkout()">
                <i class="fas fa-shopping-bag"></i>&nbsp; चेकआउट
            </button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a class="nav-item" data-page="home" onclick="navigateTo('home')">
            <i class="fas fa-home"></i><span>होम</span>
        </a>
        <a class="nav-item" data-page="calendar" onclick="navigateTo('calendar')">
            <i class="fas fa-calendar"></i><span>कैलेंडर</span>
        </a>
        <a class="nav-item plus-btn" id="plusBtn"><i class="fas fa-plus"></i></a>
        <a class="nav-item" data-page="music" onclick="navigateTo('music')">
            <i class="fas fa-music"></i><span>म्यूजिक</span>
        </a>
        <a class="nav-item active" data-page="shop" onclick="navigateTo('shop')">
            <i class="fas fa-store"></i><span>शॉप</span>
        </a>
    </nav>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
