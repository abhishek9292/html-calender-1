<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Preview - भारत कैलेंडर</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .phone-frame {
            width: 375px;
            height: 667px;
            background: #000;
            border-radius: 30px;
            padding: 15px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            background: #fff;
        }
        .instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h3>📱 Mobile Preview</h3>
        <p>View the Hindi Calendar app in a mobile frame</p>
        <p><strong>Or open:</strong> index.html directly</p>
    </div>
    <div class="phone-frame">
        <iframe src="index.html"></iframe>
    </div>
</body>
</html>
