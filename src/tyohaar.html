<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>त्योहार</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="calendar-header">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
        <div class="calendar-title"><h1 class="title has-text-white" style="font-size:1.1rem;margin:0;">त्योहार</h1></div>
        <i class="fas fa-search" onclick="navigateTo('search')" style="cursor:pointer;"></i>
    </div>

    <div style="padding:1rem;">
        <div class="tabs is-fullwidth">
            <ul>
                <li class="is-active"><a>आगामी</a></li>
                <li><a>पिछला</a></li>
                <li><a>सभी</a></li>
            </ul>
        </div>

        <h2 class="section-title">अक्टूबर 2025 के त्योहार</h2>
        <div id="festivalList"></div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" onclick="navigateTo('home')"><i class="fas fa-home"></i><span>होम</span></a>
        <a class="nav-item" onclick="navigateTo('calendar')"><i class="fas fa-calendar"></i><span>कैलेंडर</span></a>
        <a class="nav-item plus-btn" onclick="$('#plusModal').addClass('is-active')"><i class="fas fa-plus"></i></a>
        <a class="nav-item" onclick="navigateTo('music')"><i class="fas fa-music"></i><span>म्यूजिक</span></a>
        <a class="nav-item" onclick="navigateTo('ayojan')"><i class="fas fa-calendar-check"></i><span>आयोजन</span></a>
    </nav>

    <div class="modal" id="plusModal">
        <div class="modal-background" onclick="$('#plusModal').removeClass('is-active')"></div>
        <div class="modal-content plus-modal-content">
            <div class="plus-option" onclick="alert('छुट्टियां')"><i class="fas fa-umbrella-beach"></i><span>छुट्टियां</span></div>
            <div class="plus-option" onclick="navigateTo('event')"><i class="far fa-calendar"></i><span>इवेंट्स</span></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/calendar-data.js"></script>
    <script>
        $(document).ready(function() {
            let html = '';
            calendarData.festivals.forEach(festival => {
                const colors = ['#f14668', '#48c78e', '#3298dc', '#ffdd57'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                html += `<div class="box" style="margin-bottom:1rem;cursor:pointer;border-left:4px solid ${color};" onclick="showFestivalDetail('${festival.name}')">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <p style="font-weight:700;font-size:1.1rem;color:#363636;">${festival.name}</p>
                            <p style="color:#7a7a7a;font-size:0.9rem;margin-top:0.25rem;">
                                <i class="fas fa-calendar"></i> ${festival.date} अक्टूबर 2025
                            </p>
                            <span class="tag is-info is-light" style="margin-top:0.5rem;">${festival.type}</span>
                        </div>
                        <i class="fas fa-chevron-right" style="color:#dbdbdb;"></i>
                    </div>
                </div>`;
            });
            $('#festivalList').html(html);
        });

        function showFestivalDetail(name) {
            alert('त्योहार विवरण: ' + name);
        }
    </script>
</body>
</html>
